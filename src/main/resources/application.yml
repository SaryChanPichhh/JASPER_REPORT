server:
  port: 8080

spring:
  application:
    name: report-service
  datasource:
    url: jdbc:h2:mem:reportdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  task:
    execution:
      pool:
        core-size: 5
        max-size: 20
        queue-capacity: 100
        thread-name-prefix: report-async-

report:
  template-base-dir: reports/
  cache-enabled: true

logging:
  level:
    root: INFO
    com.aureumgrand.report: DEBUG
    net.sf.jasperreports: INFO
